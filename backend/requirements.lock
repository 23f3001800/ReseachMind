# Locked versions — generated from a verified-working environment.
#
# Regenerate after an intentional upgrade:
#   pip install -r requirements.txt -U && pip freeze > requirements.lock
# Do not hand-edit.
#
# These pins are load-bearing, not bureaucracy. Two production outages in this
# project came from unpinned dependency contracts changing underneath us:
#   - langchain-community switched from `duckduckgo-search` to `ddgs`, so every
#     free-tier search raised ImportError, was swallowed, and the agent invented
#     citations instead.
#   - langchain-tavily dropped the `api_key` kwarg in favour of reading
#     TAVILY_API_KEY from the environment, so premium search failed on every call.
# Both were silent. Neither would have happened with a lockfile.

